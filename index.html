<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Animations</title>
<style>
:root{--bg:#f1f1f5;--fg:#1a1a22;--card:#fff;--ac:#4f46e5;--acfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14141a;--fg:#ececf2;--card:#23232d;--ac:#818cf8;--acfg:#14141a}}
:root[data-theme="dark"]{--bg:#14141a;--fg:#ececf2;--card:#23232d;--ac:#818cf8;--acfg:#14141a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 14px 6px}
h1{font-size:18px;margin:0 0 8px}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--ac);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer}
button.on{background:var(--ac);color:var(--acfg)}
#v{flex:1;min-height:0;margin:6px 12px;border-radius:14px;overflow:hidden;background:#000}
#v canvas{display:block;width:100%;height:100%}
p{margin:0;padding:6px 14px 12px;font-size:13px;opacity:.8}
</style>
</head>
<body>
<header>
<h1>3D Animations</h1>
<nav id="nav"></nav>
</header>
<div id="v"></div>
<p id="cap"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
